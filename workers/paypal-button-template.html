<!-- PayPal + Shipping Section -->
<div class="paypal-section" style="margin:2rem 0;padding:1.5rem;background:#f8f9fa;border-radius:12px;border:1px solid #e2e8f0;">
  <h3 style="margin-top:0;font-size:1.1rem;">🛒 Buy Now</h3>

  <div style="display:flex;gap:1.2rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem;">
    <div><label style="font-weight:600;font-size:0.9rem;">Unit Price:</label>
      <span class="paypal-price" style="font-size:1.4rem;font-weight:800;color:#FF6600;"></span></div>
    <div><label style="font-weight:600;font-size:0.9rem;">Qty:</label>
      <div style="display:flex;align-items:center;gap:4px;">
        <button id="qtyDown" style="width:32px;height:32px;border:1px solid #ccc;border-radius:4px;background:#fff;font-size:1.2rem;cursor:pointer;">−</button>
        <span id="qtyDisplay" style="min-width:28px;text-align:center;font-weight:700;font-size:1.1rem;">1</span>
        <button id="qtyUp" style="width:32px;height:32px;border:1px solid #ccc;border-radius:4px;background:#fff;font-size:1.2rem;cursor:pointer;">+</button>
      </div></div>
    <div><label style="font-weight:600;font-size:0.9rem;">Ship to:</label>
      <select id="shippingCountry" style="padding:8px 12px;border:2px solid #e2e8f0;border-radius:6px;font-size:0.9rem;">
        <option value="">— Select —</option>
      </select></div>
    <div><label style="font-weight:600;font-size:0.9rem;">Total Wt:</label>
      <span id="totalWeight" style="font-size:1.1rem;font-weight:600;"></span></div>
    <div><label style="font-weight:600;font-size:0.9rem;">Shipping:</label>
      <span id="shippingCost" style="font-size:1.1rem;font-weight:600;">—</span></div>
    <div><label style="font-weight:600;font-size:0.9rem;">Total:</label>
      <span id="totalCost" style="font-size:1.4rem;font-weight:800;color:#FF6600;">—</span></div>
  </div>

  <div id="paypal-button-container" style="max-width:400px;min-height:45px;"><p style="color:#888;font-size:0.85rem;text-align:center;">Payment button loading...</p></div>
  <p style="font-size:0.8rem;color:#888;margin:0.5rem 0 0 0;">🔒 Secure checkout via PayPal. Credit/debit cards accepted.</p>
</div>

<script>
(function() {
  const CLIENT_ID = 'AcLzEUh410L2XAxnzTf4NEr03gVzcVDagOJ2iSLKpZZE7aJYt_BHaE90VcuFZszvlropHBHtR9gOLd5O';
  let qty = 1, selectedCountry = null, productWeight = 1.5;

  // DHL Express weight-band rates (USD) per zone
  // Total weight rounded up to next band. Bands: 0.5/1/1.5/2/2.5/3/3.5/4/5/6/7/8/9/10kg
  const DHL = {
    CN: { name:'China', bands:[8,12,16,20,24,28,32,36,44,52,60,68,76,84] },
    // Zone 1: Western Europe — $36.80/1.5kg
    BE: { name:'Belgium', bands:[26,32,36.8,42,48,54,60,66,78,90,102,114,126,138] },
    GB: { name:'United Kingdom', bands:[26,32,36.8,42,48,54,60,66,78,90,102,114,126,138] },
    DE: { name:'Germany', bands:[26,32,36.8,42,48,54,60,66,78,90,102,114,126,138] },
    FR: { name:'France', bands:[26,32,36.8,42,48,54,60,66,78,90,102,114,126,138] },
    IT: { name:'Italy', bands:[26,32,36.8,42,48,54,60,66,78,90,102,114,126,138] },
    ES: { name:'Spain', bands:[26,32,36.8,42,48,54,60,66,78,90,102,114,126,138] },
    NL: { name:'Netherlands', bands:[26,32,36.8,42,48,54,60,66,78,90,102,114,126,138] },
    DK:    DK: { name:'Denmark', bands:[27,33,37.5,43,49,55,61,67,79,92,105,118,131,144] },
    CH: { name:'Switzerland', bands:[26,32,36.8,42,48,54,60,66,78,90,102,114,126,138] },
    CZ:    CZ: { name:'Czech Republic', bands:[34,40,46.8,54,62,70,78,86,100,116,132,148,164,180] },
    SE: { name:'Sweden', bands:[26,32,36.8,42,48,54,60,66,78,90,102,114,126,138] },
    // Zone 2: North America — $38.80/1.5kg
    US: { name:'United States', bands:[28,34,38.8,44,50,56,62,68,80,94,108,122,136,150] },
    CA: { name:'Canada', bands:[28,34,38.8,44,50,56,62,68,80,94,108,122,136,150] },
    // Zone 3: Asia Pacific — $40.30/1.5kg
    AU: { name:'Australia', bands:[29,35,40.3,46,52,58,64,70,82,96,110,124,138,152] },
    KH: { name:'Cambodia', bands:[29,35,40.3,46,52,58,64,70,82,96,110,124,138,152] },
    JP: { name:'Japan', bands:[29,35,40.3,46,52,58,64,70,82,96,110,124,138,152] },
    KR: { name:'S.Korea', bands:[29,35,40.3,46,52,58,64,70,82,96,110,124,138,152] },
    SG: { name:'Singapore', bands:[29,35,40.3,46,52,58,64,70,82,96,110,124,138,152] },
    MY: { name:'Malaysia', bands:[29,35,40.3,46,52,58,64,70,82,96,110,124,138,152] },
    TH: { name:'Thailand', bands:[29,35,40.3,46,52,58,64,70,82,96,110,124,138,152] },
    // Zone 4: Rest of World — $52.30/1.5kg
    AF: { name:'Afghanistan', bands:[38,45,52.3,60,68,76,84,92,108,126,144,162,180,198] },
    AM: { name:'Armenia', bands:[38,45,52.3,60,68,76,84,92,108,126,144,162,180,198] },
    AR: { name:'Argentina', bands:[38,45,52.3,60,68,76,84,92,108,126,144,162,180,198] },
    BR: { name:'Brazil', bands:[38,45,52.3,60,68,76,84,92,108,126,144,162,180,198] },
    CL: { name:'Chile', bands:[38,45,52.3,60,68,76,84,92,108,126,144,162,180,198] },
    CO: { name:'Colombia', bands:[38,45,52.3,60,68,76,84,92,108,126,144,162,180,198] },
    IN: { name:'India', bands:[38,45,52.3,60,68,76,84,92,108,126,144,162,180,198] },
    ZA: { name:'South Africa', bands:[38,45,52.3,60,68,76,84,92,108,126,144,162,180,198] },
    MX: { name:'Mexico', bands:[38,45,52.3,60,68,76,84,92,108,126,144,162,180,198] },
    IL: { name:'Israel', bands:[38,45,52.3,60,68,76,84,92,108,126,144,162,180,198] },
    // Zone 5: Remote — $60.80/1.5kg (Bhutan etc)
    BT: { name:'Bhutan', bands:[44,52,60.8,70,80,90,100,110,130,150,170,190,210,230] },
    // Zone 4b: Africa — $49.10/1.5kg
    EG:    ET:    ET: { name:'Ethiopia', bands:[36,43,49.1,56,64,72,80,88,104,120,136,154,172,190] },
    EG: { name:'Egypt', bands:[36,43,49.1,56,64,72,80,88,104,120,136,154,172,190] },
    CD: { name:'Congo', bands:[36,43,49.1,56,64,72,80,88,104,120,136,154,172,190] },
    // (moved other zone 4 countries down)
        OT: { name:'Other', bands:[38,45,52.3,60,68,76,84,92,108,126,144,162,180,198] },
  };
  const BAND_WEIGHTS = [0.5,1,1.5,2,2.5,3,3.5,4,5,6,7,8,9,10];

  function getShipping(zone, totalKg) {
    const z = DHL[zone] || DHL.OT;
    for (let i = 0; i < BAND_WEIGHTS.length; i++) {
      if (totalKg <= BAND_WEIGHTS[i]) return z.bands[i];
    }
    // Above 10kg: add per-kg rate
    const last = z.bands[z.bands.length-1];
    const extra = Math.ceil(totalKg - 10) * (last / 10);
    return last + extra;
  }

  function recalc() {
    const totalKg = qty * productWeight;
    document.getElementById('totalWeight').textContent = totalKg.toFixed(1) + 'kg';
    if (!selectedCountry) {
      document.getElementById('shippingCost').textContent = '—';
      document.getElementById('totalCost').textContent = '—';
      return;
    }
    const ship = getShipping(selectedCountry, totalKg);
    const sub = (productPrice * qty);
    document.getElementById('shippingCost').textContent = '$' + ship;
    document.getElementById('totalCost').textContent = '$' + (sub + ship).toFixed(2);
  }

  // Read product price
  const productPrice = parseFloat(document.querySelector('.product-price')?.textContent?.replace(/[$,]/g,'') || '0');
  document.querySelector('.paypal-price').textContent = '$' + productPrice.toFixed(2);

  // Read weight from spec table
  document.querySelectorAll('.spec-table tr').forEach(tr => {
    const cells = tr.querySelectorAll('td');
    if (cells.length >= 2 && (cells[0].textContent.trim().includes('Weight') || cells[0].textContent.trim().includes('重量'))) {
      const w = parseFloat(cells[1].textContent.replace(/[^0-9.]/g,''));
      if (w > 0) productWeight = w;
    }
  });

  // Populate country dropdown
  const sel = document.getElementById('shippingCountry');
  Object.entries(DHL).forEach(([code, info]) => {
    const opt = document.createElement('option');
    opt.value = code; opt.textContent = info.name;
    sel.appendChild(opt);
  });

  // Events
  document.getElementById('qtyDown').onclick = () => { if (qty > 1) { qty--; document.getElementById('qtyDisplay').textContent = qty; recalc(); }};
  document.getElementById('qtyUp').onclick = () => { qty++; document.getElementById('qtyDisplay').textContent = qty; recalc(); };
  document.getElementById('shippingCountry').onchange = function() { selectedCountry = this.value; recalc(); };
  recalc();

  // PayPal SDK
  const s = document.createElement('script');
  s.src = 'https://www.paypal.com/sdk/js?client-id=' + CLIENT_ID + '&currency=USD';
  s.onload = function() {
    paypal.Buttons({
      createOrder: function() {
        if (!selectedCountry) { alert('Please select shipping destination.'); return; }
        const totalKg = qty * productWeight;
        const ship = getShipping(selectedCountry, totalKg);
        const total = ((productPrice * qty) + ship).toFixed(2);
        return fetch('https://cncdisplay-paypal.szkongto01.workers.dev/create-order', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ price: (productPrice * qty).toFixed(2), shipping: selectedCountry, weight: totalKg.toString() }),
        }).then(r=>r.json()).then(d=>d.orderId);
      },
      onApprove: function(data) {
        return fetch('https://cncdisplay-paypal.szkongto01.workers.dev/capture-order', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ orderId: data.orderID }),
        }).then(r=>r.json()).then(d=>{ alert('Payment successful! Order: ' + d.id); window.location.href='/en/quote.html'; });
      },
      onError: function() { alert('Payment error. Email us at info@cncdisplay.com'); }
    }).render('#paypal-button-container');
  };
  document.head.appendChild(s);
})();
</script>
