name = "cncdisplay-orders"
main = "src/index.js"
compatibility_date = "2026-11-25"

# Created with: npx wrangler kv namespace create ORDERS
[[kv_namespaces]]
binding = "ORDERS"
id = "80a18171c0344a5ea52694bcd46bc6a0"

# Order notification mail + customer replies from the desk. No
# destination_address here on purpose: the desk must be able to mail buyers.
# Without it Cloudflare sends to any recipient given a paid Workers plan; on the
# free plan only verified destinations are allowed (E_RECIPIENT_PLAN_RESTRICTED).
[[send_email]]
name = "NOTIFY"

[vars]
NOTIFY_TO = "szkongto01@foxmail.com"

# Traffic dashboard. Cloudflare Web Analytics (RUM) is queried through GraphQL;
# GSC needs an OAuth refresh token because the property is not shared with a
# service account.
CF_ACCOUNT_ID = "8ad8e3abfde8c636476aff4b654c49ff"
RUM_SITE_TAG = "e85da42535574162a96d4ba277c2ed40"
GSC_PROPERTY = "https://cncdisplay.com/"

# Served under the site; the zone is already proxied through Cloudflare and the
# site has no /api/ pages, so nothing else is shadowed.
[[routes]]
pattern = "cncdisplay.com/api/*"
zone_name = "cncdisplay.com"

# Order desk UI. The static site has no /admin page (checked), so this route
# only shadows a 404.
[[routes]]
pattern = "cncdisplay.com/admin"
zone_name = "cncdisplay.com"

[[routes]]
pattern = "cncdisplay.com/admin/*"
zone_name = "cncdisplay.com"
