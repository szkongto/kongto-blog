<body>
    <header><nav><a href="/en/" class="logo">Kongto Technology</a><div class="nav-links"><a href="/en/">Home</a><a href="/en/posts/">Articles</a><a href="/en/docs/">Downloads</a><a href="/en/search.html" class="nav-search active">🔍 Search</a><a href="/en/about.html">About</a></div>
        <div class="lang-switch">

        </div>
    </nav></header>
    <main>
        <div class="search-container">
            <h1>Site Search</h1>
            <p style="color:#64748b;margin-top:-0.5rem;margin-bottom:1.5rem;">Search all technical articles, brand solutions, and product downloads — by brand name, model number, or keywords</p>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search by brand, model, or keyword… e.g. FANUC A61L-0001-0093 LCD upgrade" autofocus>
                <button id="searchBtn">Search</button>
            </div>

            <div class="filter-bar" id="filterBar" style="display:none;">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="article">📄 Articles</button>
                <button class="filter-btn" data-filter="brand">🏷 Brands</button>
                <button class="filter-btn" data-filter="download">📥 Downloads</button>
                <button class="filter-btn" data-filter="zh">🇨🇳 中文</button>
                <button class="filter-btn" data-filter="en">🇬🇧 English</button>
            </div>

            <div class="search-info" id="searchInfo"></div>
            <div id="searchResults"></div>
        </div>
    </main>
    <footer><p>&copy; Kongto Technology Co.,LTD</p></footer>

<script>
let searchIndex = [];
let currentFilter = 'all';

function highlight(text, query) {
    if (!query) return text;
    const qs = query.trim().split(/\s+/).filter(w => w.length > 0);
    let result = text;
    for (const q of qs) {
        const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        result = result.replace(re, '<span class="search-highlight">$1</span>');
    }
    return result;
}

function search(query) {
    if (!searchIndex.length) {
        document.getElementById('searchResults').innerHTML = '<div class="no-results"><p>Loading search index…</p></div>';
        return;
    }
    if (!query.trim()) {
        document.getElementById('searchResults').innerHTML = '';
        document.getElementById('searchInfo').innerHTML = '';
        document.getElementById('filterBar').style.display = 'none';
        return;
    }

    const qs = query.trim().toLowerCase().split(/\s+/).filter(w => w.length > 0);
    const startTime = performance.now();

    let results = searchIndex.filter(item => {
        const searchText = item.search_text.toLowerCase();
        return qs.every(q => searchText.includes(q));
    });

    if (currentFilter === 'zh') {
        results = results.filter(r => r.lang === 'zh');
    } else if (currentFilter === 'en') {
        results = results.filter(r => r.lang === 'en');
    } else if (currentFilter !== 'all') {
        results = results.filter(r => r.category === currentFilter);
    }

    results.sort((a, b) => {
        if (a.category === 'article' && b.category !== 'article') return -1;
        if (b.category === 'article' && a.category !== 'article') return 1;
        return (b.date || '').localeCompare(a.date || '');
    });

    const elapsed = (performance.now() - startTime).toFixed(0);
    const stats = `<span class="search-stats">${results.length}</span> results (${elapsed}ms)`;
    document.getElementById('searchInfo').innerHTML = stats;
    document.getElementById('filterBar').style.display = 'flex';

    const container = document.getElementById('searchResults');
    if (results.length === 0) {
        container.innerHTML = `<div class="no-results">
            <h3>No results found</h3>
            <p>Try these keyword suggestions:</p>
            <ul>
                <li>Brand names: FANUC, Mitsubishi, Siemens, Mazak, Okuma, Haas</li>
                <li>Model numbers: A61L-0001-0093, MDT962B, CD1472, 6FC3988</li>
                <li>Keywords: CRT to LCD, LCD upgrade, CNC display, signal converter</li>
            </ul>
        </div>`;
        return;
    }

    const catLabels = { article: 'Article', brand: 'Brand', download: 'Download', page: 'Page' };
    const catTags = { article: 'tag-article', brand: 'tag-brand', download: 'tag-download', page: 'tag-page' };
    const langTags = { zh: 'tag-zh', en: 'tag-en' };

    container.innerHTML = results.map(r => {
        const desc = r.description || r.h1 || '';
        return `<div class="result-card">
            <h3 class="result-title">
                <a href="${r.url}">${highlight(r.title, query)}</a>
            </h3>
            <p class="result-desc">${highlight(desc.length > 200 ? desc.slice(0, 200) + '…' : desc, query)}</p>
            <div class="result-meta">
                <span class="result-tag ${catTags[r.category] || 'tag-page'}">${catLabels[r.category] || r.category}</span>
                <span class="result-tag ${langTags[r.lang] || 'tag-zh'}">${r.lang === 'en' ? 'English' : '中文'}</span>
                ${r.date ? `<span>📅 ${r.date.slice(0,4)}-${r.date.slice(4,6)}-${r.date.slice(6,8)}</span>` : ''}
            </div>
        </div>`;
    }).join('');
}

fetch('/search-index.json')
    .then(r => r.json())
    .then(data => {
        searchIndex = data;
        console.log('Search index loaded:', data.length, 'entries');
        const params = new URLSearchParams(window.location.search);
        const q = params.get('q');
        if (q) {
            document.getElementById('searchInput').value = q;
            search(q);
        }
    })
    .catch(err => {
        console.error('Failed to load search index:', err);
        document.getElementById('searchResults').innerHTML = '<div class="no-results"><p>Search index failed to load. Please refresh the page.</p></div>';
    });

document.getElementById('searchBtn').addEventListener('click', () => {
    search(document.getElementById('searchInput').value);
});

document.getElementById('searchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') search(e.target.value);
});

let debounceTimer;
document.getElementById('searchInput').addEventListener('input', e => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => search(e.target.value), 300);
});

document.getElementById('filterBar').addEventListener('click', e => {
    if (e.target.classList.contains('filter-btn')) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.dataset.filter;
        search(document.getElementById('searchInput').value);
    }
});
</script>
