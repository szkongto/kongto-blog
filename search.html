<body>
    <header><nav><a href="/" class="logo">深圳市江图科技有限公司</a><div class="nav-links"><a href="/">首页</a><a href="/posts/">文章</a><a href="/docs/">下载</a><a href="/search.html" class="nav-search active">🔍 搜索</a><a href="/about.html">关于</a></div>

    <main>
        <div class="search-container">
            <h1>站内搜索</h1>
            <p style="color:#64748b;margin-top:-0.5rem;margin-bottom:1.5rem;">搜索全部技术文章、品牌方案、产品下载 — 支持品牌名、型号、关键词</p>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="输入品牌名、型号或关键词… 如 FANUC A61L-0001-0093 LCD升级" autofocus>
                <button id="searchBtn">搜索</button>
            </div>

            <div class="filter-bar" id="filterBar" style="display:none;">
                <button class="filter-btn active" data-filter="all">全部</button>
                <button class="filter-btn" data-filter="article">📄 文章</button>
                <button class="filter-btn" data-filter="brand">🏷 品牌</button>
                <button class="filter-btn" data-filter="download">📥 下载</button>
                <button class="filter-btn" data-filter="zh">🇨🇳 中文</button>
                <button class="filter-btn" data-filter="en">🇬🇧 English</button>
            </div>

            <div class="search-info" id="searchInfo"></div>
            <div id="searchResults"></div>
        </div>
    </main>
    <footer><p>&copy; 深圳市江图科技有限公司</p></footer>

<script>
let searchIndex = [];
let currentFilter = 'all';

function highlight(text, query) {
    if (!query) return text;
    const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const qs = query.trim().split(/\s+/).filter(w => w.length > 0);
    let result = text;
    for (const q of qs) {
        const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        result = result.replace(re, '<span class="search-highlight">$1</span>');
    }
    return result;
}

function search(query) {
    if (!searchIndex.length) {
        document.getElementById('searchResults').innerHTML = '<div class="no-results"><p>正在加载搜索索引…</p></div>';
        return;
    }
    if (!query.trim()) {
        document.getElementById('searchResults').innerHTML = '';
        document.getElementById('searchInfo').innerHTML = '';
        document.getElementById('filterBar').style.display = 'none';
        return;
    }

    const qs = query.trim().toLowerCase().split(/\s+/).filter(w => w.length > 0);
    const startTime = performance.now();

    let results = searchIndex.filter(item => {
        const searchText = item.search_text.toLowerCase();
        return qs.every(q => searchText.includes(q));
    });

    // Apply filter
    if (currentFilter === 'zh') {
        results = results.filter(r => r.lang === 'zh');
    } else if (currentFilter === 'en') {
        results = results.filter(r => r.lang === 'en');
    } else if (currentFilter !== 'all') {
        results = results.filter(r => r.category === currentFilter);
    }

    // Sort: articles first, then by date desc
    results.sort((a, b) => {
        if (a.category === 'article' && b.category !== 'article') return -1;
        if (b.category === 'article' && a.category !== 'article') return 1;
        return (b.date || '').localeCompare(a.date || '');
    });

    const elapsed = (performance.now() - startTime).toFixed(0);
    const stats = `<span class="search-stats">${results.length}</span> 条结果 (${elapsed}ms)`;
    document.getElementById('searchInfo').innerHTML = stats;
    document.getElementById('filterBar').style.display = 'flex';

    const container = document.getElementById('searchResults');
    if (results.length === 0) {
        container.innerHTML = `<div class="no-results">
            <h3>未找到相关内容</h3>
            <p>试试以下关键词：</p>
            <ul>
                <li>品牌名：FANUC、三菱、Mitsubishi、西门子、Siemens、马扎克、Mazak</li>
                <li>型号：A61L-0001-0093、MDT962B、CD1472、6FC3988</li>
                <li>关键词：CRT转LCD、LCD升级、显示器、CNC、信号转换器</li>
            </ul>
        </div>`;
        return;
    }

    const catLabels = { article: '文章', brand: '品牌页', download: '下载', page: '页面' };
    const catTags = { article: 'tag-article', brand: 'tag-brand', download: 'tag-download', page: 'tag-page' };
    const langTags = { zh: 'tag-zh', en: 'tag-en' };

    container.innerHTML = results.map(r => {
        const desc = r.description || r.h1 || '';
        return `<div class="result-card">
            <h3 class="result-title">
                <a href="${r.url}">${highlight(r.title, query)}</a>
            </h3>
            <p class="result-desc">${highlight(desc.length > 200 ? desc.slice(0, 200) + '…' : desc, query)}</p>
            <div class="result-meta">
                <span class="result-tag ${catTags[r.category] || 'tag-page'}">${catLabels[r.category] || r.category}</span>
                <span class="result-tag ${langTags[r.lang] || 'tag-zh'}">${r.lang === 'en' ? 'English' : '中文'}</span>
                ${r.date ? `<span>📅 ${r.date.slice(0,4)}-${r.date.slice(4,6)}-${r.date.slice(6,8)}</span>` : ''}
            </div>
        </div>`;
    }).join('');
}

// Load search index
fetch('/search-index.json')
    .then(r => r.json())
    .then(data => {
        searchIndex = data;
        console.log('Search index loaded:', data.length, 'entries');
        document.getElementById('searchInput').placeholder = '搜索 ' + data.length + ' 个页面… 输入品牌名、型号或关键词';
        // Check URL for query
        const params = new URLSearchParams(window.location.search);
        const q = params.get('q');
        if (q) {
            document.getElementById('searchInput').value = q;
            search(q);
        }
    })
    .catch(err => {
        console.error('Failed to load search index:', err);
        document.getElementById('searchResults').innerHTML = '<div class="no-results"><p>搜索索引加载失败，请刷新页面重试。</p></div>';
    });

// Event handlers
document.getElementById('searchBtn').addEventListener('click', () => {
    search(document.getElementById('searchInput').value);
});

document.getElementById('searchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') search(e.target.value);
});

// Live search as you type (debounced)
let debounceTimer;
document.getElementById('searchInput').addEventListener('input', e => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => search(e.target.value), 300);
});

// Filter buttons
document.getElementById('filterBar').addEventListener('click', e => {
    if (e.target.classList.contains('filter-btn')) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.dataset.filter;
        search(document.getElementById('searchInput').value);
    }
});
</script>
