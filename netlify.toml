# ============================================================
# netlify.toml - cncdisplay.com 部署配置
# CDN 缓存 + 静态资源压缩 + 安全头部
# ============================================================

[build]
  publish = "."

[build.environment]
  HUGO_VERSION = ""

# ==================== 缓存策略 ====================
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# 静态资源长期缓存（CSS/JS/图片/字体）
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML 页面 - 短缓存
[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# sitemap 和 robots - 中等缓存
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ==================== 压缩 ====================
[[headers]]
  for = "/*"
  [headers.values]
    Content-Encoding = "gzip"

# ==================== 重定向 ====================
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/en/index.html"
  to = "/en/"
  status = 301

# 死链 301 重定向
[[redirects]]
  from = "/posts/article_20260501_%E5%B7%A5%E4%B8%9A%E8%A7%A6%E6%91%B8%E5%B1%8F%E4%B8%8E%E5%B7%A5%E6%8E%A7%E6%98%BE%E7%A4%BA%E5%99%A8%E7%9A%84%E5%8C%BA%E5%88%AB%E5%8F%8A%E9%80%89%E5%9E%8B%E5%BB%BA%E8%AE%AE.html"
  to = "/posts/"
  status = 301

[[redirects]]
  from = "/en/posts/article_20260501_%E5%B7%A5%E4%B8%9A%E8%A7%A6%E6%91%B8%E5%B1%8F%E4%B8%8E%E5%B7%A5%E6%8E%A7%E6%98%BE%E7%A4%BA%E5%99%A8%E7%9A%84%E5%8C%BA%E5%88%AB%E5%8F%8A%E9%80%89%E5%9E%8B%E5%BB%BA%E8%AE%AE.html"
  to = "/en/posts/"
  status = 301

[[redirects]]
  from = "/posts/article_20260501_FANUC_A61L_0001_0093_LCD%E6%B6%B2%E6%99%B6%E6%98%BE%E7%A4%BA%E5%99%A8_%E8%AE%A9%E8%80%81%E6%97%A7CNC%E6%95%B0%E6%8E%A7%E7%B3%BB%E7%BB%9F%E7%84%95%E5%8F%91%E6%96%B0%E6%B4%BB%E5%8A%9B.html"
  to = "/posts/article_20260503_FANUC_A61L_0001_0093_LCD.html"
  status = 301

# 品牌页规范化
[[redirects]]
  from = "/brands/:brand"
  to = "/brands/:brand.html"
  status = 301

[[redirects]]
  from = "/en/brands/:brand"
  to = "/en/brands/:brand.html"
  status = 301

# 404 处理
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
  force = false
