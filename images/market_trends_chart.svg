<defs><style>text{font-family:Arial,sans-serif;font-size:13px}.title{font-size:20px;font-weight:bold;fill:#1a5fb4}.axis{stroke:#666;stroke-width:1}.grid{stroke:#e0e0e0;stroke-width:1;stroke-dasharray:4}.bar{fill:#1a5fb4}.line-crt{stroke:#c0392b;stroke-width:3;fill:none}.line-lcd{stroke:#27ae60;stroke-width:3;fill:none}.dot{stroke:white;stroke-width:2}</style></defs>
