<script>
(function(){
    var sections = document.querySelectorAll('.cn-brand-section');
    var totalModels = 0, brandCounts = {};
    sections.forEach(function(s){
        var rows = s.querySelectorAll('table tr:not(:first-child)');
        var brand = s.getAttribute('data-brand');
        brandCounts[brand] = rows.length;
        totalModels += rows.length;
    });
    var brandNames = {'FANUC':'FANUC','涓夎彵':'涓夎彵','Mazak':'椹墡鍏?,'瑗块棬瀛?:'瑗块棬瀛?,'澶ч殘':'澶ч殘','鍝堟柉':'鍝堟柉'};
    var statsHtml = '<span class="stat-chip">馃彮 '+Object.keys(brandCounts).length+' 涓搧鐗?/span><span class="stat-chip">馃搵 '+totalModels+' 涓瀷鍙?/span>';
    for(var k in brandCounts){ statsHtml += '<span class="stat-chip" style="font-size:12px;">'+brandNames[k]+' '+brandCounts[k]+'</span>'; }
    document.getElementById('cnStatsBar').innerHTML = statsHtml;

    window.cnFilterBrand = function(brand, btn){
        document.querySelectorAll('.brand-btn').forEach(function(b){ b.classList.remove('active'); });
        if(btn) btn.classList.add('active');
        var showAll = brand === 'all';
        sections.forEach(function(s){
            var match = showAll || s.getAttribute('data-brand') === brand;
            s.style.display = match ? '' : 'none';
        });
        var hasVisible = false;
        sections.forEach(function(s){ if(s.style.display !== 'none') hasVisible = true; });
        document.getElementById('cnNoResults').style.display = hasVisible ? 'none' : 'block';
    }

    function cnSearchFilter(){
        var term = document.getElementById('cnSearchInput').value.trim().toLowerCase();
        if(!term){ sections.forEach(function(s){ s.style.display = ''; }); document.getElementById('cnNoResults').style.display = 'none'; document.querySelectorAll('.brand-btn').forEach(function(b){ b.classList.remove('active'); }); document.querySelector('.brand-btn').classList.add('active'); return; }
        document.querySelectorAll('.brand-btn').forEach(function(b){ b.classList.remove('active'); });
        var hasVisible = false;
        sections.forEach(function(s){
            var rows = s.querySelectorAll('table tr');
            var found = false;
            for(var i=1;i<rows.length;i++){
                var txt = rows[i].textContent.toLowerCase();
                if(txt.indexOf(term) !== -1){ found = true; break; }
            }
            if(found){ s.style.display = ''; hasVisible = true; }
            else { s.style.display = 'none'; }
        });
        document.getElementById('cnNoResults').style.display = hasVisible ? 'none' : 'block';
    }

    document.getElementById('cnSearchInput').addEventListener('input', cnSearchFilter);
})();
</script>
